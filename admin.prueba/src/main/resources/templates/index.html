}
    <section class="content">
      <div class="container-fluid">
        <!-- Small boxes (Stat box) -->
		<div class="row">

		  <!-- Orders -->
		  <div class="col-lg-3 col-6">
		    <div class="small-box bg-info">
		      <div class="inner">
		        <h3 th:text="${lista.size()}"></h3>
		        <p>Orders</p>
		      </div>
		      <div class="icon"><i class="ion ion-bag"></i></div>
		      <a href="#dropOrders" class="small-box-footer" data-toggle="collapse">
		        More info <i class="fas fa-chevron-down"></i>
		      </a>
		    </div>

		    <div class="collapse mt-2" id="dropOrders">
		      <div class="card card-body p-2">
		        <ul class="mb-0">
		          <li th:each="o:${lista}" th:text="${o}"></li>
		        </ul>
		      </div>
		    </div>
		  </div>
		  

		  <!-- Bounce -->
		  <div class="col-lg-3 col-6 position-relative">

		    <div class="small-box bg-success">
		      <div class="inner">
		        <h3 th:text="${bouncePorcentaje+'%'}"></h3>
		        <p>Bounce Rate</p>
		      </div>
		      <div class="icon">
		        <i class="ion ion-stats-bars"></i>
		      </div>
		      <a href="#bounceDrop" class="small-box-footer" data-toggle="collapse">
		        More info <i class="fas fa-chevron-down"></i>
		      </a>
		    </div>

			<div class="collapse mt-2" id="bounceDrop">
				   
		      <div class="card card-body p-2">
		        <ul class="mb-0">
		          <li th:each="b:${bounce}" th:text="${b?'Entró':'No entró'}"></li>
		        </ul>
		      </div>
		    </div>

		  </div>

		  <!-- Users -->
		  <div class="col-lg-3 col-6">
		    <div class="small-box bg-warning">
		      <div class="inner">
		        <h3 th:text="${listaU.size()}"></h3>
		        <p>Users</p>
		      </div>
		      <div class="icon"><i class="ion ion-person-add"></i></div>
		      <a href="#dropUsers" class="small-box-footer" data-toggle="collapse">
		        More info <i class="fas fa-chevron-down"></i>
		      </a>
		    </div>

		    <div class="collapse mt-2" id="dropUsers">
		      <div class="card card-body p-2">
		        <ul class="mb-0">
		          <li th:each="u:${listaU}" th:text="${u}"></li>
		        </ul>
		      </div>
		    </div>
		  </div>

		  <!-- Visitors -->
		  <div class="col-lg-3 col-6">
		    <div class="small-box bg-danger">
		      <div class="inner">
		        <h3 th:text="${listaN.size()}"></h3>
		        <p>Visitors</p>
		      </div>
		      <div class="icon"><i class="ion ion-pie-graph"></i></div>
		      <a href="#dropVisitors" class="small-box-footer" data-toggle="collapse">
		        More info <i class="fas fa-chevron-down"></i>
		      </a>
		    </div>

		    <div class="collapse mt-2" id="dropVisitors">
		      <div class="card card-body p-2">
		        <ul class="mb-0">
		          <li th:each="v:${listaN}" th:text="${v}"></li>
		        </ul>
		      </div>
		    </div>
		  </div>

		</div>
          <!-- ./col -->
          <div class="col-lg-3 col-6">
           
        </div>

        <!-- Main row -->
        <div class="row">
          <!-- Left col -->
          <section class="col-lg-7 connectedSortable">
           
              

                <!-- /. tools -->
              </div>

            </div>
            <!-- /.card -->
          </section>
          <!-- right col -->
